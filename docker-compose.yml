services:
  charlendar:
    build: .
    ports:
      - "9191:9191"
    environment:
      SQLITE_FILE: /data/charlendar.db
      ROOT_PATH: ${ROOT_PATH:-}
      HMAC_SECRET: ${HMAC_SECRET:-dev-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      BOOKING_DURATION_MINUTES: ${BOOKING_DURATION_MINUTES:-60}
      GOOGLE_TOKEN_FILE: ${GOOGLE_TOKEN_FILE:-/secrets/token.json}
      GOOGLE_SENDER_EMAIL: ${GOOGLE_SENDER_EMAIL:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9191}
    volumes:
      - charlendar-data:/data
      - ./secrets:/secrets
    restart: unless-stopped

volumes:
  charlendar-data:
